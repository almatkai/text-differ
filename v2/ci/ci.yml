# INACTIVE REVIEW TEMPLATE: this file is intentionally outside .github/workflows.
name: Text Differ V2 standalone validation
on: [workflow_dispatch]
jobs:
  rust:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
        rust: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path v2/Cargo.toml --check
      - run: cargo test --locked --all-targets --manifest-path v2/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path v2/Cargo.toml -- -D warnings
  oracle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: python3 v2/scripts/validate.py
# Windows linked/live OS and real GUI acceptance still require actual evidence.
